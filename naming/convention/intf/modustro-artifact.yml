# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java, python]
  Name: Naming convention Public interfaces
  Description: Technology-neutral naming and version-policy contracts exposed in Java and Python.

Dependencies:
  - DependencyKind: modustro
    Items:
      # XMLDEFS imports this documentation vocabulary during Defs Codegen.
      # Build-time only: the documentation/intf artifact is Java-only and must
      # not become a Python runtime/package dependency of naming contracts.
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_documentation.intf
        Usages: [develop_implementation]
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_common.util
        Usages: [product_api]
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.dataobject.intf
        Usages: [product_api]
      # Generated mutable Python contracts expose SmartDataObject interfaces.
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.smartdataobject.intf
        Usages: [product_api]
      # Transitional: existing generated classes still extend the legacy runtime.
      # Newly generated classes use impl.common; keep both until codegen migrates.
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.smartdataobject.impl.common
        Usages: [product_api]
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
