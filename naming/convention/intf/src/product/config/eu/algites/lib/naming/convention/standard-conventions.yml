# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/standard-conventions_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/standard-conventions_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/standard-conventions_1.yamldef.schema.json
IdentifierConventions:
  IdentifierConvention:
    - name: all_lower_1
      ConversionStyle: lower_flat
      Regexp: (?<identifier>[a-z][a-z0-9]*)
    - name: all_upper_1
      ConversionStyle: upper_flat
      Regexp: (?<identifier>[A-Z][A-Z0-9]*)
    - name: lower_snake_case_1
      ConversionStyle: lower_snake
      Regexp: (?<identifier>[a-z][a-z0-9]*(?:_[a-z][a-z0-9]*)*)
    - name: upper_snake_case_1
      ConversionStyle: upper_snake
      Regexp: (?<identifier>[A-Z][A-Z0-9]*(?:_[A-Z][A-Z0-9]*)*)
    - name: lower_camel_case_1
      ConversionStyle: lower_camel
      Regexp: (?<identifier>[a-z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)
    - name: upper_camel_case_1
      ConversionStyle: upper_camel
      Regexp: (?<identifier>[A-Z][a-z0-9]*(?:[A-Z][a-z0-9]*)*)
    - name: lower_kebab_case_1
      ConversionStyle: lower_kebab
      Regexp: (?<identifier>[a-z][a-z0-9]*(?:-[a-z][a-z0-9]*)*)
    - name: upper_kebab_case_1
      ConversionStyle: upper_kebab
      Regexp: (?<identifier>[A-Z][A-Z0-9]*(?:-[A-Z][A-Z0-9]*)*)
VersionConventions:
  VersionConvention:
    - name: positive_integer_1
      Regexp: (?<version>[1-9][0-9]*)
    - name: major_minor_1
      Regexp: (?<version>(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*))
