$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java, python]
  Name: Naming convention core implementation
  Description: Standard Algites naming profiles and reusable default convention definitions.

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.coreintf
        Usages: [product_api]
        VersionRequirement: { Exact: "1.0-SNAPSHOT" }
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
