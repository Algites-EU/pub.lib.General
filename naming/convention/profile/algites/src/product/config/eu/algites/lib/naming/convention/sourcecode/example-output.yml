# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/sourcecode/source-structure-name-conventions_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/sourcecode/source-structure-name-conventions_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/sourcecode/source-structure-name-conventions_1.yamldef.schema.json
StandardConventionsFile: standard-conventions.yml
NameFragments:
  NameFragment:
    - name: output-java-suffix_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: .java
    - name: generated-interface-prefix_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: AIig
NameCompositions:
  NameComposition:
    - name: example-output-stem_1
      Segments:
        - NameFragmentsSegmentReference:
            Ref: generated-interface-prefix_1
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: __
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: channel
                Regexp: '[a-z]+'
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: __
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: minor
                Regexp: 0|[1-9][0-9]*
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: '-'
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: major
                Regexp: 0|[1-9][0-9]*
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: __
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: region
                Regexp: '[a-z]+(?:_[a-z]+)*'
SourceStructureNameConventions:
  NameConventions:
    NameConvention:
      - name: example-output_1
        ContainerStructureType: interface
        StructureNaming:
          Rule:
            - kind: type_name
              Value: example-output-stem_1
            - kind: file_name_stem
              Value: example-output-stem_1
            - kind: file_name_suffix
              Value: output-java-suffix_1
