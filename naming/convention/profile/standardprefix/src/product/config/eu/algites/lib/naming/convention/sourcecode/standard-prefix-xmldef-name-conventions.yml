# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/sourcecode/source-structure-name-conventions_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/sourcecode/source-structure-name-conventions_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/sourcecode/source-structure-name-conventions_1.yamldef.schema.json
StandardConventionsFile: standard-conventions.yml
NameCompositions:
  NameComposition:
    - name: schema-name_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: schema-stem_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: lower_kebab_case_1
    - name: schema-stem-versioned_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: lower_kebab_case_1
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _
        - NameFragmentsSegmentValue:
            Kind: version
            Content:
              Convention: positive_integer_1
    - name: schema-enum-item_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: lower_snake_case_1
    - name: xmldefs-schema-suffix_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: .xsd
    - name: schema-property_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: schema-package_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: lower_snake_case_1
SourceStructureNameConventions:
  NameConventions:
    NameConvention:
      - name: standard-prefix-xmldef-schema_1
        ContainerStructureType: object
        StructureNaming:
          Rule:
            - kind: type_name
              Value: schema-name_1
            - kind: file_name_stem
              Value: schema-stem_1
            - kind: file_name_suffix
              Value: xmldefs-schema-suffix_1
            - kind: enum_item_name
              Value: schema-enum-item_1
            - kind: field_name
              Value: schema-property_1
            - kind: package_segment_name
              Value: schema-package_1
      - name: standard-prefix-xmldef-schema-versioned_1
        ContainerStructureType: object
        StructureNaming:
          Rule:
            - kind: type_name
              Value: schema-name_1
            - kind: file_name_stem
              Value: schema-stem-versioned_1
            - kind: file_name_suffix
              Value: xmldefs-schema-suffix_1
            - kind: enum_item_name
              Value: schema-enum-item_1
            - kind: field_name
              Value: schema-property_1
            - kind: package_segment_name
              Value: schema-package_1
