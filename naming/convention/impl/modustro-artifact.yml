# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java, python]
  Name: Generic naming catalog implementation
  Description: Reusable, profile-neutral Java/Python YAML naming catalog parser and renderer.

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.intf
        Usages: [product_api]
  - DependencyKind: java
    Items:
      - GroupId: com.fasterxml.jackson.core
        ArtifactId: jackson-databind
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=2.0.0"
          Maximum: "<3.0.0"
          MaximumStrict: true
      - GroupId: com.fasterxml.jackson.dataformat
        ArtifactId: jackson-dataformat-yaml
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=2.0.0"
          Maximum: "<3.0.0"
          MaximumStrict: true
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
  - DependencyKind: python
    Items:
      - ArtifactId: pyyaml
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=6.0"
      - ArtifactId: pytest
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=8.0"
          Maximum: "<10.0"
          MaximumStrict: true
