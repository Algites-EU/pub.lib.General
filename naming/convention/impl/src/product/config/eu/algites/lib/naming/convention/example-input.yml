# An independent schema naming catalog. Demonstrates custom named variables.
# Input: customer_address--eu_west--beta--2.7.demo.schema
# Captures identifier=customer_address, region=eu_west, channel=beta,
# version=2.7, major=2, minor=7.
StandardConventionsFile: standard-conventions.yml
VersionConventions:
  example_major_minor:
    Regexp: '(?<version>(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*))'
NameFragments:
  input-schema-suffix:
    Segments:
      - Kind: constant_string
        Value: '.demo.schema'
  schema-identifier:
    Segments:
      - Kind: identifier
        Convention: lower_snake_case
NameCompositions:
  example-input-stem:
    Segments:
      - Ref: schema-identifier
      - Kind: constant_string
        Value: '--'
      - Kind: variable
        Name: region
        Regexp: '[a-z]+(?:_[a-z]+)*'
      - Kind: constant_string
        Value: '--'
      - Kind: variable
        Name: channel
        Regexp: '[a-z]+'
      - Kind: constant_string
        Value: '--'
      - Kind: version
        Convention: example_major_minor
NameConventions:
  example-input:
    ContainerStructureType: object
    StructureNaming:
      main_container_name: example-input-stem
      file_name_stem: example-input-stem
      file_name_suffix: input-schema-suffix
