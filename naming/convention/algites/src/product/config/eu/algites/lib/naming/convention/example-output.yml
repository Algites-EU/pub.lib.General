# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/source-structure-name-conventions_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/lib/naming/convention/source-structure-name-conventions_1.yamldef.schema.json
StandardConventionsFile: standard-conventions.yml
NameFragments:
  output-java-suffix_1:
    Segments:
    - Kind: constant_string
      Value: .java
  generated-interface-prefix_1:
    Segments:
    - Kind: constant_string
      Value: AIig
NameCompositions:
  example-output-stem_1:
    Segments:
    - Ref: generated-interface-prefix_1
    - Kind: identifier
      Convention: upper_camel_case_1
    - Kind: constant_string
      Value: __
    - Kind: variable
      Name: channel
      Regexp: '[a-z]+'
    - Kind: constant_string
      Value: __
    - Kind: variable
      Name: minor
      Regexp: 0|[1-9][0-9]*
    - Kind: constant_string
      Value: '-'
    - Kind: variable
      Name: major
      Regexp: 0|[1-9][0-9]*
    - Kind: constant_string
      Value: __
    - Kind: variable
      Name: region
      Regexp: '[a-z]+(?:_[a-z]+)*'
SourceStructureNameConventions:
  NameConventions:
    example-output_1:
      ContainerStructureType: interface
      StructureNaming:
        main_container_name: example-output-stem_1
        file_name_stem: example-output-stem_1
        file_name_suffix: output-java-suffix_1
