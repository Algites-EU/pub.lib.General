# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java, python]
  Name: Source-code naming convention definitions
  Description: JSON, YAML, and XML definitions for source-code, DataObject and SmartDataObject naming profiles, with generated typed contracts.

Dependencies:
  - DependencyKind: modustro
    Items:
      # XMLDEFS imports this documentation vocabulary during Defs Codegen.
      # Build-time only: the documentation/intf artifact is Java-only and must
      # not become a Python runtime/package dependency of naming contracts.
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_documentation.intf
        Usages: [develop_implementation]
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.intf
        Usages: [product_api]
