    Items:
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_journal.intf
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
