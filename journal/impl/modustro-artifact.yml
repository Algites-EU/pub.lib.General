$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: General in-memory journal implementation
  Description: Thread-safe atomic in-memory journal with ordered before/after append listeners.

Dependencies:
