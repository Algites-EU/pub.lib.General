$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: Algites version scheme v1
  Description: Version 1 of the Algites ecosystem version scheme.


Dependencies:
- DependencyKind: java
  Items:
  - GroupId: org.testng
    ArtifactId: testng
    Usages:
    - develop_implementation
    VersionRequirement:
      Minimum: '>=7.0.0'
      Maximum: <8.0.0
      MaximumStrict: true
  - GroupId: jakarta.annotation
    ArtifactId: jakarta.annotation-api
    Usages:
    - product_implementation
    VersionRequirement:
      Exact: 3.0.0
- DependencyKind: modustro
  Items:
  - GroupId: eu.algites.lib.common
    ArtifactId: pub.lib.General_version.common.intf
    Usages:
    - product_api
    VersionRequirement:
      Exact: 1.1-SNAPSHOT
