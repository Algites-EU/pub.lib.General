Artifact:
  TechnologyKinds: [java]
  Name: Maven to Gradle version conversion
  Description: Conversion of Maven version requirements to Gradle version constraints.

Dependencies:
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
