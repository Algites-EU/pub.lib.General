$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: Action execution engine contracts
  Description: Typed actions, plans, scheduling, worker services, failure policies and result contracts.

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_action.interaction.intf
        Usages: [product_api]
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_action.execution.common.intf
        Usages: [product_api]
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_action.execution.resource.intf
        Usages: [product_api]
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
