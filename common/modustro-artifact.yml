# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: General purpose modules and utilities
  Description: General-purpose support Open source utilities shared across Algites artifacts and repositories.



Dependencies:
- DependencyKind: java
  Items:
  - GroupId: org.testng
    ArtifactId: testng
    Usages:
    - develop_implementation
    VersionRequirement:
      Minimum: '>=7.0.0'
      Maximum: <8.0.0
      MaximumStrict: true
  - GroupId: jakarta.annotation
    ArtifactId: jakarta.annotation-api
    Usages:
    - product_implementation
    VersionRequirement:
      Exact: 3.0.0
  - GroupId: org.jetbrains
    ArtifactId: annotations
    Usages:
    - product_compile_only_api
    VersionRequirement:
      Exact: 26.0.2
