        ArtifactId: pub.lib.General_data.smartdataobject.intf
        Usages: [product_api]
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.dataobject.intf
        Usages: [product_api]
      - GroupId: eu.algites.lib.text
        ArtifactId: pub.lib.General_text.format
        Usages: [product_api]
  - DependencyKind: python
    Items:
      - ArtifactId: PyYAML
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=6.0"
          Maximum: "<7.0"
          MaximumStrict: true
